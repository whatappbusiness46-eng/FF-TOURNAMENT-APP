<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZyroX Arena Admin</title><style>body{font-family:system-ui;background:#0d1421;color:#fff;margin:0;padding:20px}input,textarea,button{padding:11px;border-radius:10px;border:1px solid #34445a;background:#152136;color:#fff;margin:5px 0}button{background:#13c6da;color:#071019;font-weight:800;cursor:pointer}.card{background:#151f30;border:1px solid #2a3548;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.muted{color:#9aa6b8}pre{white-space:pre-wrap}</style></head><body><h1>⚡ ZyroX Arena Admin</h1><div class="card"><input id="api" placeholder="API URL" value=""><input id="token" placeholder="ADMIN_TOKEN" type="password"><button onclick="load()">Connect</button></div><div id="out"></div><script>
const $=id=>document.getElementById(id); let data;
async function req(p,o={}){return fetch(($('api').value||location.origin)+p,{...o,headers:{'Content-Type':'application/json','x-admin-token':$('token').value,...(o.headers||{})}}).then(r=>r.json())}
async function load(){data=await req('/api/admin/overview');render();}
function render(){let s=data.settings,r=data.rules;out.innerHTML=`<div class=grid><div class=card><h2>Payment</h2><label>bKash</label><br><input id=b value="${s.bkashNumber||'01742166737'}"><br><label>Nagad</label><br><input id=n value="${s.nagadNumber||'01730649062'}"><br><label>Referral %</label><br><input id=rp type=number value="${s.referralPercent||5}"><br><label>Support Telegram</label><br><input id=st value="${s.supportTelegram||''}"><br><button onclick="saveSettings()">Save Settings</button></div><div class=card><h2>BR Rules</h2><label>Entry</label><br><input id=be type=number step=.5 value="${r.br.entryFee}"><br><label>Per Kill</label><br><input id=bk type=number step=.5 value="${r.br.perKill}"><br><label>Rewards JSON</label><br><textarea id=br rows=5>${JSON.stringify(r.br.rewards)}</textarea><hr><h3>CS 4 VS 4</h3><input id=ce type=number value="${r.cs.entryFee}" placeholder="Entry"><input id=cw type=number value="${r.cs.winnerReward}" placeholder="Winner reward"><input id=cs type=number value="${r.cs.secondReward}" placeholder="Second reward"><h3>Lone Wolf</h3><input id=le type=number value="${r.lw.entryFee}" placeholder="Entry"><input id=lw type=number value="${r.lw.winnerReward}" placeholder="Winner reward"><br><button onclick="saveRules()">Save Rules</button></div></div><div class=card><h2>Matches</h2><input id=mtitle placeholder="Match title"><input id=mode value="br" placeholder="modeId"><input id=fee type=number value="5" placeholder="entry"><input id=prize type=number value="0" placeholder="prize"><input id=max type=number value="48" placeholder="max"><input id=start placeholder="start time"><input id=room placeholder="room ID"><input id=pass placeholder="room password"><button onclick="addMatch()">Create Match</button><pre>${JSON.stringify(data.matches,null,2)}</pre></div><div class=card><h2>Deposits</h2><pre>${JSON.stringify(data.deposits,null,2)}</pre></div><div class=card><h2>Withdrawals</h2><pre>${JSON.stringify(data.withdrawals,null,2)}</pre></div>`}
async function saveSettings(){await req('/api/admin/settings',{method:'PUT',body:JSON.stringify({bkashNumber:b.value,nagadNumber:n.value,referralPercent:Number(rp.value),supportTelegram:st.value})});load()}
async function saveRules(){let rewards=JSON.parse(br.value);await req('/api/admin/rules',{method:'PUT',body:JSON.stringify({br:{...data.rules.br,entryFee:Number(be.value),perKill:Number(bk.value),rewards},cs:{...data.rules.cs,entryFee:Number(ce.value),winnerReward:Number(cw.value),secondReward:Number(cs.value)},lw:{...data.rules.lw,entryFee:Number(le.value),winnerReward:Number(lw.value)}})});load()}
async function addMatch(){await req('/api/admin/matches',{method:'POST',body:JSON.stringify({title:mtitle.value,modeId:mode.value,entryFee:Number(fee.value),prize:Number(prize.value),maxPlayers:Number(max.value),startAt:start.value,roomId:room.value,roomPassword:pass.value})});load()}
</script></body></html>
