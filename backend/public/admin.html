<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZyroX Arena Admin</title><style>body{font-family:system-ui;background:#0d1421;color:#fff;margin:0;padding:18px}input,textarea,button,select{box-sizing:border-box;width:100%;padding:11px;border-radius:10px;border:1px solid #34445a;background:#152136;color:#fff;margin:5px 0}button{background:#13c6da;color:#071019;font-weight:800;cursor:pointer}.card{background:#151f30;border:1px solid #2a3548;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#9aa6b8}.mode{border:1px solid #34445a;padding:12px;border-radius:12px;margin:10px 0}</style></head><body><h1>⚡ ZyroX Arena Admin</h1><div class="card"><input id="api" placeholder="Backend API URL (e.g. https://your-service.onrender.com)"><input id="token" placeholder="ADMIN_TOKEN" type="password"><button onclick="load()">Connect / Load</button><div id="msg"></div></div><div id="out"></div><script>
const $=id=>document.getElementById(id);let data;
async function req(p,o={}){const res=await fetch(($('api').value||location.origin)+p,{...o,headers:{'Content-Type':'application/json','x-admin-token':$('token').value,...(o.headers||{})}});const j=await res.json().catch(()=>({error:'Invalid server response'}));if(!res.ok)throw Error(j.error||('HTTP '+res.status));return j}
async function load(){try{data=await req('/api/admin/overview');render();$('msg').textContent='Connected and loaded';}catch(e){$('msg').textContent='Error: '+e.message}}
function render(){const s=data.settings||{},rules=data.rules||{},modes=data.modes||[],matches=data.matches||[];let modeCards=modes.map(m=>{let r=rules[m.id]||{};return `<div class="mode"><h3>${esc(m.name)} (${esc(m.id)}) — ${esc(m.game||'Free Fire')}</h3><label>Entry Fee</label><input type="number" step="0.01" data-rule="${esc(m.id)}" data-field="entryFee" value="${num(r.entryFee)}"><label>Per Kill Reward</label><input type="number" step="0.01" data-rule="${esc(m.id)}" data-field="perKill" value="${num(r.perKill)}"><label>Winner Reward</label><input type="number" step="0.01" data-rule="${esc(m.id)}" data-field="winnerReward" value="${num(r.winnerReward)}"><label>Second Reward</label><input type="number" step="0.01" data-rule="${esc(m.id)}" data-field="secondReward" value="${num(r.secondReward)}"><label>Rewards (JSON array/object, optional)</label><textarea rows="3" data-rule="${esc(m.id)}" data-field="rewards">${esc(JSON.stringify(r.rewards??[]))}</textarea></div>`}).join('');out.innerHTML=`<div class="grid"><div class="card"><h2>Payment & Settings</h2><label>bKash number</label><input id="bkash" value="${esc(s.bkashNumber||'')}"><label>Nagad number</label><input id="nagad" value="${esc(s.nagadNumber||'')}"><label>Referral %</label><input id="ref" type="number" value="${num(s.referralPercent)}"><label>Support Telegram</label><input id="tg" value="${esc(s.supportTelegram||'')}"><button onclick="saveSettings()">Save Settings</button></div><div class="card"><h2>Match Rules — all configured modes</h2>${modeCards}<button onclick="saveAllRules()">Save All Rules</button></div></div><div class="card"><h2>General Match Rules Text</h2><p class="muted">প্রতিটি লাইনে একটি নিয়ম। Player app-এর public config-এ এই তালিকা পাঠানো হয়।</p><textarea id="ruletext" rows="14">${esc((data.rulesText||[]).join('\n'))}</textarea><button onclick="saveRuleText()">Save Rule Text</button></div><div class="card"><h2>Modes — Add/Edit/Enable</h2><p class="muted">ID unique রাখুন (যেমন br, cs, lw, ludo)।</p><div id="modeedit">${modes.map((m,i)=>`<div class="mode"><input data-mode="${i}" data-mfield="id" value="${esc(m.id)}" placeholder="ID"><input data-mode="${i}" data-mfield="name" value="${esc(m.name)}" placeholder="Name"><input data-mode="${i}" data-mfield="game" value="${esc(m.game||'Free Fire')}" placeholder="Game"><label><input style="width:auto" type="checkbox" data-mode="${i}" data-mfield="enabled" ${m.enabled?'checked':''}> Enabled</label></div>`).join('')}</div><h3>Add mode</h3><input id="newid" placeholder="Unique ID"><input id="newname" placeholder="Mode name"><input id="newgame" value="Free Fire" placeholder="Game"><button onclick="addMode()">Add Mode</button><button onclick="saveModes()">Save Modes</button></div><div class="card"><h2>Create Match</h2><input id="mtitle" placeholder="Match title"><select id="modeid">${modes.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} — ${esc(m.game||'')}</option>`).join('')}</select><input id="fee" type="number" value="5" placeholder="Entry fee"><input id="prize" type="number" value="0" placeholder="Total prize"><input id="max" type="number" value="48" placeholder="Max players"><input id="start" placeholder="Start time (ISO or text)"><input id="room" placeholder="Room ID (optional)"><input id="pass" placeholder="Room password (optional)"><button onclick="addMatch()">Create Match</button><pre>${esc(JSON.stringify(matches,null,2))}</pre></div><div class="card"><h2>Deposits</h2><pre>${esc(JSON.stringify(data.deposits||[],null,2))}</pre></div><div class="card"><h2>Withdrawals</h2><pre>${esc(JSON.stringify(data.withdrawals||[],null,2))}</pre></div><div class="card"><h2>Users</h2><pre>${esc(JSON.stringify((data.users||[]).map(u=>({id:u.id,name:u.name,contact:u.contact,balance:u.balance})),null,2))}</pre></div>`}
function num(v){return v==null?'':Number(v)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function saveSettings(){try{await req('/api/admin/settings',{method:'PUT',body:JSON.stringify({bkashNumber:$('bkash').value,nagadNumber:$('nagad').value,referralPercent:Number($('ref').value),supportTelegram:$('tg').value})});await load();alert('Settings saved');}catch(e){alert(e.message)}}
async function saveAllRules(){try{let r={...(data.rules||{})};document.querySelectorAll('[data-rule]').forEach(el=>{const id=el.dataset.rule,field=el.dataset.field;r[id]=r[id]||{};if(field==='rewards'){r[id][field]=JSON.parse(el.value||'[]')}else if(el.value.trim()===''){delete r[id][field]}else r[id][field]=Number(el.value)});await req('/api/admin/rules',{method:'PUT',body:JSON.stringify(r)});await load();alert('All mode rules saved');}catch(e){alert('Save failed: '+e.message)}}
async function saveRuleText(){try{await req('/api/admin/rules-text',{method:'PUT',body:JSON.stringify({rulesText:$('ruletext').value.split('\n').map(x=>x.trim()).filter(Boolean)})});await load();alert('Rule text saved');}catch(e){alert(e.message)}}
function collectModes(){return [...document.querySelectorAll('[data-mode][data-mfield]')].reduce((a,el)=>{let i=Number(el.dataset.mode),f=el.dataset.mfield;a[i]=a[i]||{...data.modes[i]};a[i][f]=f==='enabled'?el.checked:el.value.trim();return a},[]).filter(Boolean)}
async function saveModes(){try{let m=collectModes();if(m.some(x=>!x.id||!x.name))throw Error('Mode ID and name required');if(new Set(m.map(x=>x.id)).size!==m.length)throw Error('Duplicate mode IDs');await req('/api/admin/modes',{method:'PUT',body:JSON.stringify(m)});await load();alert('Modes saved');}catch(e){alert(e.message)}}
async function addMode(){try{let id=$('newid').value.trim(),name=$('newname').value.trim(),game=$('newgame').value.trim()||'Free Fire';if(!id||!name)throw Error('ID and name required');let m=collectModes();if(m.some(x=>x.id===id)||data.modes.some(x=>x.id===id))throw Error('ID already exists');m.push({id,name,game,enabled:true});await req('/api/admin/modes',{method:'PUT',body:JSON.stringify(m)});await load();alert('Mode added');}catch(e){alert(e.message)}}
async function addMatch(){try{await req('/api/admin/matches',{method:'POST',body:JSON.stringify({title:$('mtitle').value,modeId:$('modeid').value,entryFee:Number($('fee').value),prize:Number($('prize').value),maxPlayers:Number($('max').value),startAt:$('start').value,roomId:$('room').value,roomPassword:$('pass').value})});await load();alert('Match created');}catch(e){alert(e.message)}}
</script></body></html>
